<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail - Tri Fajar Sahari</title>
  <link rel="stylesheet" href="web.css">
</head>
<body>

  <div class="profile-card">
    
    <div class="profile-header">
      <div class="avatar-container">
        <img src="https://placeholder.com" alt="foto guru" class="profile-avatar">
  
      </div>
      <div class="profile-title">
        <h3>Miss</h3>
        <p>Guru</p>
      </div>
    </div>

    <div class="profile-details">
      
      <div class="detail-row">
        <span class="detail-label">Posisi</span>
        <span class="detail-value font-bold">Guru</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value font-bold">-</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Jenis Kelamin</span>
        <span class="detail-value">Perempuan</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Kontak</span>
        <span class="detail-value">-</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Media Sosial</span>
        <span class="detail-value">-</span>
      </div>

    </div>
    
    <div class="action-container">
      <a href="home.html" class="back-btn">Kembali ke Daftar</a>
    </div>

  </div>

</body>
</html>
